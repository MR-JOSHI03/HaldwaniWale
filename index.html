<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Haldwani, on your feed</title>
<meta name="description" content="Five Instagram pages from the foothills of Haldwani. Preview a page, then tap to follow.">
<meta name="theme-color" content="#0E1030">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,300..900&family=Hanken+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --sky-top:#E9E2F4; --sky-bot:#FCE3C4;
  --ridge-1:#B9A7D6; --ridge-2:#8C78B8; --ridge-3:#5B4A8A;
  --ink:#1E1640; --ink-soft:#4A3F72;
  --paper:#FFFBF4; --line:rgba(30,22,64,.14);
  --marigold:#F4A300; --buransh:#D7263D; --pine:#2E6B55;
  --shadow:0 30px 60px -20px rgba(40,20,80,.45);
  --btn-bg:#1E1640; --btn-ink:#FFFBF4;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky-top:#0E1030; --sky-bot:#3A1F4F;
    --ridge-1:#2B2458; --ridge-2:#1E1A44; --ridge-3:#141233;
    --ink:#FFF6E8; --ink-soft:#CFC3E8;
    --paper:#1B1740; --line:rgba(255,246,232,.14);
    --shadow:0 30px 70px -20px rgba(0,0,0,.7);
    --btn-bg:#F4A300; --btn-ink:#1E1640;
  }
}
:root[data-theme="dark"]{
  --sky-top:#0E1030; --sky-bot:#3A1F4F;
  --ridge-1:#2B2458; --ridge-2:#1E1A44; --ridge-3:#141233;
  --ink:#FFF6E8; --ink-soft:#CFC3E8;
  --paper:#1B1740; --line:rgba(255,246,232,.14);
  --shadow:0 30px 70px -20px rgba(0,0,0,.7);
  --btn-bg:#F4A300; --btn-ink:#1E1640;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; min-height:100%;
  font-family:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--ink);
  background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-bot) 70%);
  background-attachment:fixed;
  overflow-x:hidden;
}
a{color:inherit}
:focus-visible{outline:3px solid var(--marigold);outline-offset:4px;border-radius:6px}

/* ---------- hills (parallax 3D backdrop) ---------- */
.hills{position:fixed;inset:0;pointer-events:none;z-index:0;perspective:800px}
.hills svg{position:absolute;left:-5%;width:110%;bottom:0;height:auto;transition:transform .4s ease-out}
.sun{position:fixed;top:14vh;right:12vw;width:min(22vw,180px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 40% 40%,#FFD27A,var(--marigold) 60%,transparent 72%);
  opacity:.9;filter:blur(.5px);z-index:0;transition:transform .4s ease-out}

main{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:clamp(20px,5vw,56px) clamp(16px,4vw,40px) 40px}

/* ---------- hero ---------- */
header.hero{text-align:center;margin-bottom:clamp(8px,2vw,20px)}
.place{font-weight:700;font-size:.95rem;color:var(--ink-soft);letter-spacing:.02em;margin:0 0 10px}
h1{
  font-family:"Anybody","Arial Narrow",sans-serif;
  font-variation-settings:"wdth" 60;
  font-weight:900;
  font-size:clamp(3rem,10vw,7.5rem);
  line-height:.86;margin:0;letter-spacing:-.01em;
  text-shadow:0 2px 0 var(--marigold),0 4px 0 var(--buransh),0 18px 40px rgba(40,20,80,.25);
  animation:stretch 1.6s cubic-bezier(.2,.8,.2,1) both;
}
h1 span{display:block;font-variation-settings:"wdth" 150;font-weight:300;font-size:.42em;letter-spacing:.01em;text-shadow:none;margin-top:.25em}
@keyframes stretch{from{font-variation-settings:"wdth" 150;opacity:0;transform:translateY(20px)}to{font-variation-settings:"wdth" 60;opacity:1;transform:none}}
.lede{max-width:46ch;margin:18px auto 0;font-size:clamp(1rem,2.2vw,1.15rem);line-height:1.55;color:var(--ink-soft)}

/* ---------- 3D ring ---------- */
.stage{
  position:relative;height:clamp(440px,62vh,560px);
  perspective:1400px;perspective-origin:50% 40%;
  margin-top:clamp(10px,3vw,30px);
  touch-action:pan-y; user-select:none; -webkit-user-select:none;
  cursor:grab;
}
.stage.dragging{cursor:grabbing}
.ring{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}
.card{
  --w:clamp(210px,26vw,270px);
  position:absolute;width:var(--w);height:calc(var(--w)*1.42);
  left:calc(var(--w)/-2);top:calc(var(--w)*-0.71);
  transform-style:preserve-3d;
  text-decoration:none;
}
.flip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,1.4,.4,1)}
.card.is-open .flip{transform:rotateY(180deg)}
.face{opacity:var(--o,1);position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;box-shadow:var(--shadow)}

/* front: postcard */
.front{
  background:var(--c1);
  color:#FFFBF4;
  display:flex;flex-direction:column;justify-content:space-between;padding:20px;
}
.front::before{content:"";position:absolute;inset:0;
  background:
    radial-gradient(120% 70% at 100% 0%,var(--c2) 0%,transparent 60%),
    repeating-linear-gradient(135deg,rgba(255,255,255,.06) 0 2px,transparent 2px 14px);}
.front>*{position:relative}
.stamp{align-self:flex-end;width:62px;height:72px;border:2px dashed rgba(255,251,244,.7);border-radius:6px;display:grid;place-items:center;
  font-family:"Anybody",sans-serif;font-weight:900;font-size:2rem;font-variation-settings:"wdth" 70;transform:rotate(6deg)}
.front .big{font-family:"Anybody",sans-serif;font-weight:800;font-variation-settings:"wdth" 55;font-size:clamp(1.9rem,3.6vw,2.4rem);line-height:.92;word-break:break-word;margin:0}
.front .tag{display:inline-block;margin-top:10px;padding:5px 11px;border-radius:999px;background:rgba(255,251,244,.18);font-size:.85rem;font-weight:700;backdrop-filter:blur(4px)}
.front .hint{font-size:.8rem;opacity:.8;margin-top:12px}

/* back: instagram-like preview */
.back{
  transform:rotateY(180deg);background:var(--paper);color:var(--ink);
  padding:18px;display:flex;flex-direction:column;gap:12px;
  opacity:0;transition:opacity .2s .15s;
}
.card.is-open .back{opacity:var(--o,1)}
.who{display:flex;align-items:center;gap:12px}
.avatar{width:62px;height:62px;border-radius:50%;padding:3px;flex:none;
  background:conic-gradient(from 200deg,#FEDA75,#FA7E1E,#D62976,#962FBF,#4F5BD5,#FEDA75)}
.avatar i{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;border:3px solid var(--paper);
  background:linear-gradient(135deg,var(--c1),var(--c2));color:#FFFBF4;font-style:normal;
  font-family:"Anybody",sans-serif;font-weight:900;font-size:1.4rem;font-variation-settings:"wdth" 70}
.who b{display:block;font-size:1rem;word-break:break-all}
.who small{color:var(--ink-soft);font-size:.8rem}
.bio{margin:0;font-size:.9rem;line-height:1.45;color:var(--ink-soft)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;border-radius:10px;overflow:hidden;flex:1;min-height:0}
.grid span{background:linear-gradient(var(--a),var(--c1),var(--c2));opacity:.9}
.grid span:nth-child(3n+2){opacity:.65}.grid span:nth-child(4n){opacity:.45}
.follow{
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:12px;border-radius:12px;background:var(--btn-bg);color:var(--btn-ink);
  font-weight:700;font-size:.95rem;
}
.follow svg{width:18px;height:18px}

/* controls */
.controls{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:6px}
.controls button{
  appearance:none;border:1px solid var(--line);background:var(--paper);color:var(--ink);
  width:48px;height:48px;border-radius:50%;font-size:1.2rem;cursor:pointer;box-shadow:0 8px 20px -10px rgba(40,20,80,.4)
}
.dots{display:flex;gap:8px}
.dots button{width:10px;height:10px;padding:0;border-radius:50%;box-shadow:none;background:var(--line)}
.dots button[aria-current="true"]{background:var(--buransh);width:26px;border-radius:6px}
.helper{text-align:center;color:var(--ink-soft);font-size:.9rem;margin:14px 0 0}

/* quick list */
.list{margin:clamp(40px,7vw,70px) auto 0;max-width:760px;background:var(--paper);border:1px solid var(--line);border-radius:26px;padding:clamp(18px,3vw,28px);box-shadow:var(--shadow)}
.list h2{font-family:"Anybody",sans-serif;font-variation-settings:"wdth" 70;font-weight:800;font-size:clamp(1.5rem,3.5vw,2rem);margin:0 0 4px}
.list p{margin:0 0 16px;color:var(--ink-soft)}
.list ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.list a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;text-decoration:none;border:1px solid var(--line);transition:transform .2s,border-color .2s}
.list a:hover{transform:translateX(4px);border-color:var(--buransh)}
.list .mini{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;color:#FFFBF4;font-weight:900;background:linear-gradient(135deg,var(--c1),var(--c2))}
.list b{flex:1;word-break:break-all}
.list em{font-style:normal;font-weight:700;color:var(--buransh);font-size:.9rem}
footer{text-align:center;color:var(--ink-soft);font-size:.85rem;margin-top:36px}

@media (max-width:640px){
  .stage{height:430px;perspective:1000px}
  .card{--w:200px}
}
@media (prefers-reduced-motion:reduce){
  h1{animation:none}
  .flip{transition:none}
}
</style>
</head>
<body>

<div class="sun" id="sun" aria-hidden="true"></div>
<div class="hills" aria-hidden="true">
  <svg id="h1" viewBox="0 0 1440 420" preserveAspectRatio="none" style="height:62vh"><path fill="var(--ridge-1)" d="M0 260 L120 170 L230 230 L360 110 L480 210 L600 140 L720 220 L860 90 L990 200 L1110 130 L1240 210 L1360 150 L1440 190 V420 H0Z"/><path fill="#fff" opacity=".55" d="M360 110 L385 135 L372 132 L360 145 L348 131 L336 134Z M860 90 L888 118 L873 114 L860 128 L846 113 L832 117Z"/></svg>
  <svg id="h2" viewBox="0 0 1440 320" preserveAspectRatio="none" style="height:42vh"><path fill="var(--ridge-2)" d="M0 200 L150 120 L300 190 L460 100 L620 180 L780 120 L940 200 L1100 110 L1270 190 L1440 130 V320 H0Z"/></svg>
  <svg id="h3" viewBox="0 0 1440 220" preserveAspectRatio="none" style="height:24vh"><path fill="var(--ridge-3)" d="M0 150 C200 90 320 170 520 120 S860 60 1040 130 S1320 110 1440 90 V220 H0Z"/><g fill="var(--pine)" opacity=".9"><path d="M80 150 l14-44 14 44z M110 148 l10-32 10 32z M1300 120 l14-44 14 44z M1330 118 l10-30 10 30z M700 118 l12-38 12 38z"/></g></svg>
</div>

<main>
  <header class="hero">
    <h1>Haldwani,<span>on your feed</span></h1>
    <p class="lede">Five pages from the foothills. Hover a card to preview the profile, tap it to open Instagram and hit follow.</p>
  </header>

  <section class="stage" id="stage" aria-label="Instagram profiles">
    <div class="ring" id="ring"></div>
  </section>

  <div class="controls">
    <button id="prev" aria-label="Previous profile">‹</button>
    <div class="dots" id="dots"></div>
    <button id="next" aria-label="Next profile">›</button>
  </div>
  <p class="helper" id="helper">Drag to spin. Hover to preview. Click to follow.</p>

  <section class="list" aria-labelledby="alltitle">
    <h2 id="alltitle">Follow all five</h2>
    <p>One tap each. Takes less than a minute.</p>
    <ul id="list"></ul>
  </section>

  <footer>Made in the hills of Kumaon.</footer>
</main>

<script>
(function(){
  // Edit handles, bios and colours here
  const profiles = [
    {h:"haldwaniwale",      tag:"City page",  bio:"Haldwani's streets, food, people and everything happening in the city.", c1:"#D7263D", c2:"#F4A300"},
    {h:"mr_joshi03",        tag:"Personal",   bio:"Everyday life, moments and stories from the hills.",                    c1:"#2E6B55", c2:"#9BD1A8"},
    {h:"shivamsnipsai",     tag:"AI",         bio:"Quick AI snippets, tools and experiments you can use today.",           c1:"#4F3CC9", c2:"#FF6FB5"},
    {h:"girlfromhaldwani",  tag:"Lifestyle",  bio:"Life, style and stories from a girl who grew up in Haldwani.",          c1:"#C2185B", c2:"#FFB199"},
    {h:"techyaira",         tag:"Tech",       bio:"Tech explained simply. Gadgets, apps and AI without the jargon.",       c1:"#0D6E8A", c2:"#6FE3E1"}
  ];
  const url = h => "https://www.instagram.com/" + h + "/";
  const initial = h => h.replace(/[^a-z]/gi,"").charAt(0).toUpperCase();
  const igIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>';

  const ring = document.getElementById("ring");
  const stage = document.getElementById("stage");
  const dots = document.getElementById("dots");
  const list = document.getElementById("list");
  const N = profiles.length, step = 360 / N;
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const canHover = window.matchMedia("(hover: hover) and (pointer: fine)").matches;
  if(!canHover) document.getElementById("helper").textContent = "Swipe to spin. Tap a card to preview, tap again to open.";

  const cards = profiles.map((p,i)=>{
    const a = document.createElement("a");
    a.className = "card"; a.href = url(p.h); a.target = "_blank"; a.rel = "noopener";
    a.style.setProperty("--c1",p.c1); a.style.setProperty("--c2",p.c2);
    a.setAttribute("aria-label","Open @"+p.h+" on Instagram");
    const tiles = Array.from({length:9},(_,k)=>'<span style="--a:'+(k*40)+'deg"></span>').join("");
    a.innerHTML =
      '<div class="flip">'+
        '<div class="face front">'+
          '<div class="stamp">'+initial(p.h)+'</div>'+
          '<div><p class="big">@'+p.h+'</p><span class="tag">'+p.tag+'</span>'+
          '<div class="hint">'+(canHover?"Hover to preview":"Tap to preview")+'</div></div>'+
        '</div>'+
        '<div class="face back">'+
          '<div class="who"><div class="avatar"><i>'+initial(p.h)+'</i></div>'+
          '<div><b>'+p.h+'</b><small>Instagram</small></div></div>'+
          '<p class="bio">'+p.bio+'</p>'+
          '<div class="grid" aria-hidden="true">'+tiles+'</div>'+
          '<div class="follow">'+igIcon+'Follow on Instagram</div>'+
        '</div>'+
      '</div>';
    ring.appendChild(a);

    const d = document.createElement("button");
    d.setAttribute("aria-label","Show @"+p.h);
    d.addEventListener("click",()=>goTo(i));
    dots.appendChild(d);

    const li = document.createElement("li");
    li.innerHTML = '<a href="'+url(p.h)+'" target="_blank" rel="noopener" style="--c1:'+p.c1+';--c2:'+p.c2+'"><span class="mini">'+initial(p.h)+'</span><b>@'+p.h+'</b><em>Follow</em></a>';
    list.appendChild(li);
    return a;
  });

  // ---- ring state ----
  let rot = 0, target = 0, hovering = false, dragging = false, moved = 0, startX = 0, startRot = 0, lastT = performance.now();
  function radius(){ const w = cards[0].offsetWidth; return Math.round(w / (2*Math.tan(Math.PI/N)) + w*0.22); }
  let R = radius();
  window.addEventListener("resize",()=>{ R = radius(); });

  function layout(){
    const front = ((Math.round(-rot/step) % N) + N) % N;
    ring.style.transform = "translateZ("+(-R)+"px) rotateX(-6deg) rotateY("+rot+"deg)";
    cards.forEach((c,i)=>{
      c.style.transform = "rotateY("+(i*step)+"deg) translateZ("+R+"px)";
      let ang = ((i*step + rot) % 360 + 360) % 360; if(ang>180) ang -= 360;
      const f = Math.cos(ang*Math.PI/180);
      c.style.setProperty("--o",(0.25 + 0.75*Math.max(0,(f+1)/2)).toFixed(2));
      c.style.pointerEvents = f > 0.2 ? "auto" : "none";
      c.tabIndex = f > 0.2 ? 0 : -1;
      if(f < 0.2) c.classList.remove("is-open");
    });
    [...dots.children].forEach((d,i)=>d.setAttribute("aria-current", i===front ? "true":"false"));
  }

  function goTo(i){ target = -i*step; }
  document.getElementById("prev").onclick = ()=>{ target = Math.round(target/step)*step + step; };
  document.getElementById("next").onclick = ()=>{ target = Math.round(target/step)*step - step; };

  function tick(t){
    const dt = Math.min(50, t - lastT); lastT = t;
    if(!dragging && !hovering && !reduce) target -= dt * 0.006; // slow auto-spin
    rot += (target - rot) * (reduce ? 1 : 0.08);
    layout();
    requestAnimationFrame(tick);
  }

  // ---- hover / tap preview ----
  cards.forEach(c=>{
    c.addEventListener("pointerenter",e=>{ if(e.pointerType==="mouse"){ hovering = true; c.classList.add("is-open"); }});
    c.addEventListener("pointerleave",e=>{ if(e.pointerType==="mouse"){ hovering = false; c.classList.remove("is-open"); }});
    c.addEventListener("focus",()=>{ hovering = true; c.classList.add("is-open"); });
    c.addEventListener("blur",()=>{ hovering = false; c.classList.remove("is-open"); });
    c.addEventListener("click",e=>{
      if(moved > 8){ e.preventDefault(); return; }         // was a drag, not a click
      if(!canHover && !c.classList.contains("is-open")){    // touch: first tap previews
        e.preventDefault();
        cards.forEach(o=>o.classList.remove("is-open"));
        c.classList.add("is-open"); hovering = true;
      }
    });
  });
  document.addEventListener("pointerdown",e=>{
    if(!canHover && !e.target.closest(".card")){ cards.forEach(o=>o.classList.remove("is-open")); hovering = false; }
  });

  // ---- drag / swipe ----
  stage.addEventListener("pointerdown",e=>{
    dragging = true; moved = 0; startX = e.clientX; startRot = target;
    stage.classList.add("dragging");
  });
  window.addEventListener("pointermove",e=>{
    if(!dragging) return;
    const dx = e.clientX - startX; moved = Math.max(moved, Math.abs(dx));
    target = startRot + dx * 0.35;
  });
  window.addEventListener("pointerup",()=>{
    if(!dragging) return;
    dragging = false; stage.classList.remove("dragging");
    if(moved > 8) target = Math.round(target/step)*step;
    setTimeout(()=>{ moved = 0; }, 0);
  });
  window.addEventListener("keydown",e=>{
    if(e.key==="ArrowLeft") document.getElementById("prev").click();
    if(e.key==="ArrowRight") document.getElementById("next").click();
  });

  // ---- hills parallax ----
  if(!reduce){
    const layers = [["h1",8],["h2",16],["h3",28],["sun",-12]].map(([id,k])=>[document.getElementById(id),k]);
    window.addEventListener("pointermove",e=>{
      const x = e.clientX/innerWidth - .5, y = e.clientY/innerHeight - .5;
      layers.forEach(([el,k])=>{ el.style.transform = "translate3d("+(-x*k)+"px,"+(-y*k*0.5)+"px,0)"; });
    });
  }

  layout();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
